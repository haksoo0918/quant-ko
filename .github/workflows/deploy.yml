name: Deploy to Oracle Cloud VM

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      run_mode:
        description: '오라클 VM 배포 직후 실행 모드 (status, dry-run, none)'
        required: true
        default: 'status'
        type: choice
        options:
          - status
          - dry-run
          - none

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff pytest pytest-cov
        pip install -e .

    - name: Run Unit Tests (Quality Gate)
      run: |
        pytest -v

    - name: Deploy to Oracle Cloud VM via SSH
      if: ${{ secrets.ORACLE_HOST != '' && secrets.ORACLE_SSH_KEY != '' }}
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.ORACLE_HOST }}
        username: ${{ secrets.ORACLE_USER || 'ubuntu' }}
        key: ${{ secrets.ORACLE_SSH_KEY }}
        script: |
          cd /home/ubuntu/quant-ko
          git pull origin main || git pull origin dev
          .venv/bin/pip install -e .
          (crontab -l 2>/dev/null | grep -v 'quant-ko'; cat << 'EOF'
          30 8 * * 1-5 cd /home/ubuntu/quant-ko && (git pull origin dev >> /home/ubuntu/quant-ko/deploy.log 2>&1 || true) && /home/ubuntu/quant-ko/.venv/bin/python -m quant_ko.main --mode monitor --env mock >> /home/ubuntu/quant-ko/monitor.log 2>&1
          20 15 * * 1-5 cd /home/ubuntu/quant-ko && (git pull origin dev >> /home/ubuntu/quant-ko/deploy.log 2>&1 || true) && /home/ubuntu/quant-ko/.venv/bin/python -m quant_ko.main --mode rebalance --env mock --strategy standard >> /home/ubuntu/quant-ko/rebalance.log 2>&1
          0 18 * * 1-5 cd /home/ubuntu/quant-ko && (git pull origin dev >> /home/ubuntu/quant-ko/deploy.log 2>&1 || true) && /home/ubuntu/quant-ko/.venv/bin/python -m quant_ko.main --mode preview --env mock --strategy standard >> /home/ubuntu/quant-ko/preview.log 2>&1
          EOF
          ) | crontab -
          RUN_MODE="${{ github.event.inputs.run_mode }}"
          if [ "$RUN_MODE" = "status" ]; then
            echo "Executing status check..."
            /home/ubuntu/quant-ko/.venv/bin/python -m quant_ko.main --mode status --env mock
          elif [ "$RUN_MODE" = "dry-run" ]; then
            echo "Executing dry-run rebalance..."
            /home/ubuntu/quant-ko/.venv/bin/python -m quant_ko.main --mode rebalance --dry-run --env mock --strategy standard --force
          fi
